<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>Rouf's Recommendations — Vetted Apps & Tools</title>
  <meta name="description" content="An authoritative, curated catalog of vetted recommendations across iOS applications, cross-platform utilities, Zero Trust networking, and homelab software.">
  <meta name="theme-color" content="#ffffff">
  
  <!-- Open Graph / Meta -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://recomendation.roufsweb.com/">
  <meta property="og:title" content="Rouf's Recommendations — Vetted Apps & Tools">
  <meta property="og:description" content="Direct catalog of vetted iOS apps, desktop tools, and Zero Trust networks with zero ads and zero paywalls.">
  
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://is1-ssl.mzstatic.com" crossorigin>
  <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
</head>
<body>

  <!-- Minimal Sticky Header with Brand, Search & Category Filters -->
  <header class="app-header" role="banner">
    <div class="header-container">
      
      <!-- Top Brand Row -->
      <div class="brand-row">
        <a href="#" class="brand" aria-label="Rouf's Recommendations">
          <div class="brand-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
          <span class="brand-title">Rouf's Recommendations</span>
        </a>

        <div class="header-actions">
          <a href="https://github.com/roufsweb/roufs-recommendation" target="_blank" rel="noopener" class="action-btn action-btn-github" title="GitHub Repository">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
            </svg>
            <span class="btn-text">GitHub</span>
          </a>
        </div>
      </div>

      <!-- Integrated Compact Search Input -->
      <div class="search-wrap">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input 
          type="search" 
          id="search-input" 
          class="search-input" 
          placeholder="Search recommendations... (Press /)" 
          aria-label="Search recommendations"
          autocomplete="off"
          spellcheck="false"
        >
        <button type="button" id="search-clear-btn" class="search-clear-btn" aria-label="Clear search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- Category Filter Tabs -->
      <div class="category-tabs" id="category-tabs" role="tablist" aria-label="Category Filters">
        <button class="category-pill active" data-category="all" role="tab" aria-selected="true">
          All <span class="pill-count" id="count-all">18</span>
        </button>
        <button class="category-pill" data-category="ios" role="tab" aria-selected="false">
          iOS <span class="pill-count" id="count-ios">11</span>
        </button>
        <button class="category-pill" data-category="cross-platform" role="tab" aria-selected="false">
          Cross-Platform <span class="pill-count" id="count-cross-platform">2</span>
        </button>
        <button class="category-pill" data-category="networking" role="tab" aria-selected="false">
          Zero Trust <span class="pill-count" id="count-networking">2</span>
        </button>
        <button class="category-pill" data-category="homelab" role="tab" aria-selected="false">
          Homelab <span class="pill-count" id="count-homelab">2</span>
        </button>
        <button class="category-pill" data-category="web-indices" role="tab" aria-selected="false">
          Media <span class="pill-count" id="count-web-indices">1</span>
        </button>
      </div>

    </div>
  </header>

  <!-- Main View: The Recommended App Tiles Grid -->
  <main class="main-wrapper" id="main-content">
    
    <!-- Meta Status Line -->
    <div class="status-row">
      <span id="results-count-text">18 Recommendations</span>
      <div class="platform-chips" id="platform-chips">
        <button class="platform-chip active" data-platform="all">All</button>
        <button class="platform-chip" data-platform="iOS">iOS</button>
        <button class="platform-chip" data-platform="macOS">macOS</button>
        <button class="platform-chip" data-platform="Windows">Windows</button>
        <button class="platform-chip" data-platform="Linux">Linux</button>
      </div>
    </div>

    <!-- Recommendations Tile Grid (Optimized for iOS / Slip Phone / All Devices) -->
    <div class="tiles-grid" id="tiles-grid" role="region" aria-label="App Recommendations Grid">
      <!-- Dynamically populated via app.js -->
    </div>

    <!-- Empty State -->
    <div class="empty-state" id="empty-state" style="display: none;">
      <p class="empty-title">No recommendations found</p>
      <p class="empty-desc">Try a different keyword or reset filters.</p>
      <button type="button" class="btn-reset-filters" id="btn-reset-filters">
        Reset Filters
      </button>
    </div>

  </main>

  <!-- Detail Bottom Sheet / Modal (Native iOS Sheet Feel) -->
  <div class="modal-backdrop" id="modal-backdrop" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-card" id="modal-card">
      <div class="drawer-handle" aria-hidden="true"></div>
      
      <div class="modal-header">
        <div class="modal-header-left">
          <img src="" alt="" class="modal-icon" id="modal-icon">
          <div class="modal-title-wrap">
            <h2 id="modal-title">App Name</h2>
            <p id="modal-subcategory">Category</p>
          </div>
        </div>
        <button type="button" class="modal-close-btn" id="modal-close-btn" aria-label="Close dialog">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="modal-body" id="modal-body">
        <!-- Content injected by app.js -->
      </div>

      <div class="modal-footer">
        <div id="modal-badges" class="tile-badges"></div>
        <div class="modal-footer-links" id="modal-links"></div>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast-container" aria-live="polite">
    <div class="toast" id="toast">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
      <span id="toast-message">Copied to clipboard!</span>
    </div>
  </div>

  <!-- Back To Top Button -->
  <button type="button" class="back-to-top" id="back-to-top" aria-label="Back to top">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18 15 12 9 6 15"></polyline>
    </svg>
  </button>

  <!-- Minimal Footer -->
  <footer class="app-footer" role="contentinfo">
    <div class="footer-container">
      <p>Rouf's Recommendations &middot; <a href="https://github.com/roufsweb/roufs-recommendation" target="_blank" rel="noopener">GitHub</a> &middot; <a href="https://github.com/roufsweb/roufs-recommendation/blob/main/CONTRIBUTING.md" target="_blank" rel="noopener">Contribute</a></p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
