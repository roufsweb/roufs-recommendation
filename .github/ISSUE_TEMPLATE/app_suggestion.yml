name: Suggest a Recommendation
description: Recommend a mobile app, cross-platform tool, networking solution, or web resource.
title: "[Recommendation]: <Name>"
labels: ["enhancement", "recommendation"]
body:
  - type: input
    id: item_name
    attributes:
      label: Name
      description: What is the exact name of the app, tool, or resource?
      placeholder: e.g., LocalSend, aaPanel
    validations:
      required: true
  - type: input
    id: item_link
    attributes:
      label: Official Link
      description: Please provide the official website, GitHub repo, or App Store link.
      placeholder: https://...
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Which section does this recommendation belong to?
      options:
        - iOS Application
        - Cross-Platform Tools & Utilities
        - Remote Access & Zero Trust VPN
        - Homelab, Server & Router OS
        - Web Resource & Media Index
        - Other
    validations:
      required: true
  - type: dropdown
    id: pricing
    attributes:
      label: Pricing Model
      description: Is it completely free, open source, or freemium?
      options:
        - Free & Open Source (FOSS)
        - 100% Free
        - Free with Ads
        - Freemium (Generous Free Tier)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Why do you recommend it?
      description: Provide a concise description of why this tool is exceptional.
      placeholder: It's the best free alternative because...
    validations:
      required: true
